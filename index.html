<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopify Product Quality Checklist</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo-section">
                    <svg class="shopify-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#95BF47"/>
                        <path d="M2 17L12 22L22 17" stroke="#95BF47" stroke-width="2"/>
                        <path d="M2 12L12 17L22 12" stroke="#95BF47" stroke-width="2"/>
                    </svg>
                    <h1>Product Quality Checklist</h1>
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </header>

        <main class="main-content">
            <!-- Progress Section -->
            <section class="progress-section">
                <div class="progress-header">
                    <h2>Completion Progress</h2>
                    <span class="progress-percentage" id="progressPercentage">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-stats">
                    <span id="completedCount">0</span> of <span id="totalCount">11</span> items completed
                </div>
            </section>

            <!-- Product Info -->
            <section class="product-info">
                <div class="input-group">
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" placeholder="Enter product name...">
                </div>
                <div class="input-group">
                    <label for="productId">Product ID (optional)</label>
                    <input type="text" id="productId" placeholder="e.g., 123456789">
                </div>
            </section>

            <!-- Checklist Section -->
            <section class="checklist-section">
                <h2>Quality Checks</h2>
                
                <div class="checklist-grid" id="checklistContainer">
                    <!-- Checklist items will be generated by JavaScript -->
                </div>
            </section>

            <!-- Actions -->
            <section class="actions-section">
                <button class="btn btn-secondary" id="resetBtn">Reset</button>
                <button class="btn btn-primary" id="exportBtn">Export Report</button>
            </section>
        </main>

        <footer class="footer">
            <p>Shopify Product Quality Checker • Built for merchants</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
